<!doctype html>
<html><head><meta charset="utf-8"><title>Glow Steps Shorts</title>
<style>
@font-face { font-family: 'Sora'; font-weight: 800; src: url('fonts/sora-latin-800-normal.woff2') format('woff2'); }
@font-face { font-family: 'Sora'; font-weight: 700; src: url('fonts/sora-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 600; src: url('fonts/inter-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 700; src: url('fonts/inter-latin-700-normal.woff2') format('woff2'); }
html, body { margin: 0; background: #0E0B22; height: 100%; }
body { display: flex; align-items: center; justify-content: center; }
canvas { display: block; height: 100vh; width: auto; max-width: 100vw; object-fit: contain; }
body.capture canvas { height: auto; width: auto; }
#play { position: fixed; font: 800 28px Sora, sans-serif; padding: 18px 36px; border: 0; border-radius: 40px; background: #8B6CFF; color: #F5F3FF; cursor: pointer; }
#play:focus-visible { outline: 4px solid #FF6B8B; outline-offset: 4px; }
</style></head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<button id="play" hidden>▶ Play</button>
<script>if (location.search.includes('capture')) document.body.className = 'capture';</script>
<script type="module" src="src/main.js"></script>
</body></html>
